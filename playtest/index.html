<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#14110d">
<title>Playtest · O Relojoeiro · Beyond Suspicion Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110d; --surface:#1d1912; --surface2:#262017; --line:#3b3326;
  --gold:#c9a95c; --cream:#ecdcb0; --text:#e6dcc4; --muted:#a49a82;
  --danger:#e8957f; --ok:#9cc59b;
  --display:'IM Fell English','Iowan Old Style',Georgia,serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:660px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-left)) 72px max(18px,env(safe-area-inset-right))}
header.brand{display:flex;align-items:center;gap:16px;padding-bottom:22px;border-bottom:1px solid var(--line)}
header.brand img{width:64px;height:64px;flex:none}
.brand .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.brand h1{margin:2px 0 0;font:400 30px/1.1 var(--display);color:var(--cream);text-wrap:balance}
.steps{display:flex;gap:8px;margin:22px 0 6px}
.steps div{flex:1;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:3px solid var(--line);padding-top:8px}
.steps div.on{color:var(--cream);border-color:var(--gold)}
.steps div.done{color:var(--muted);border-color:#7d6b3d}
h2{font:400 28px/1.2 var(--display);color:var(--cream);margin:26px 0 6px;text-wrap:balance}
h3{font:400 22px/1.25 var(--display);color:var(--cream);margin:38px 0 6px;padding-top:26px;border-top:1px solid var(--line);text-wrap:balance}
p{margin:0 0 14px}
.lead{color:var(--muted)}
.q{margin:26px 0 0;padding:0;border:0;min-width:0}
.q>label,.q>legend{display:block;font-weight:500;color:var(--text);margin:0 0 4px;padding:0}
.hint{display:block;font-size:14px;color:var(--muted);margin:0 0 10px}
.err{display:none;font-size:14px;color:var(--danger);margin-top:8px}
.q.bad .err{display:block}
.q.bad>label,.q.bad>legend{color:var(--danger)}
input[type=text],textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font:inherit}
textarea{min-height:96px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.opts{display:grid;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:block;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:6px;pointer-events:none}
.opt input:checked+span{border-color:var(--gold);background:var(--surface2);color:var(--cream)}
.opt input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.scale{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.scale .opt span{padding:12px 0;text-align:center}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.grid{display:grid;gap:18px;margin-top:6px}
.grid .row>div{font-size:15px;margin-bottom:6px}
.money{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px 10px}
.money .val{font:400 30px/1 var(--display);color:var(--cream);min-height:32px}
.money .val.empty{font:400 15px/32px var(--body);color:var(--muted)}
.money input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:6px 0 0;--pct:0%;touch-action:pan-y}
.money input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--gold) var(--pct),var(--line) var(--pct))}
.money input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.money input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--gold)}
.money input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--gold);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--gold);margin-top:-11px}
.money input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--gold)}
.money.untouched input[type=range]::-webkit-slider-runnable-track{background:var(--line)}
.money.untouched input[type=range]::-webkit-slider-thumb{background:var(--bg);box-shadow:0 0 0 1px var(--muted);border-color:var(--muted)}
.money.untouched input[type=range]::-moz-range-thumb{background:var(--bg);box-shadow:0 0 0 1px var(--muted);border-color:var(--muted)}
.money input[type=range]:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:4px}
.money .ends{margin-top:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:18px 0}
.box strong{color:var(--cream);font-weight:600}
.cards{display:grid;gap:16px;margin:18px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.card .ph{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line)}
.card img{display:block;width:100%;height:auto;max-width:100%}
.card .tx{padding:14px 16px}
.card h4{margin:0 0 4px;font:400 21px/1.2 var(--display);color:var(--cream)}
.card .pr{color:var(--gold);font-weight:600}
.card p{margin:6px 0 0;font-size:15px;color:var(--text)}
.card small{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.btn{display:inline-block;font:600 16px var(--body);letter-spacing:.04em;background:var(--gold);color:#17130c;border:0;border-radius:6px;padding:14px 26px;cursor:pointer}
.btn:hover{background:#d6b96e}
.btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--gold)}
.btn[disabled]{opacity:.6;cursor:wait}
.actions{margin-top:34px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--muted)}
.status{border-radius:6px;padding:12px 14px;margin:14px 0;font-size:15px;border:1px solid var(--line);background:var(--surface)}
.status.ok{border-color:#4d6a4c;color:var(--ok)}
.status.warn{border-color:#8a5a4b;color:var(--danger)}
.copybox{width:100%;min-height:150px;margin:10px 0;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
footer{margin-top:54px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center;letter-spacing:.06em}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .35s ease both}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
@media (max-width:420px){.brand h1{font-size:25px}.scale.s11{grid-auto-flow:row;grid-template-columns:repeat(6,1fr);grid-auto-columns:auto}}
</style>
</head>

const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
function load(){
  try{ const j = JSON.parse(localStorage.getItem(LS)); if(j && j.id) return j; }catch(e){}
  return {id:uid(), name:"", a:{1:{},2:{},3:{}}, done:{}, sent:{}, notice:null, view:null};
}
let S = load();
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
const $ = (s, r=document) => r.querySelector(s);
const el = (t, a={}, h="") => { const e = document.createElement(t); for(const k in a) e.setAttribute(k, a[k]); if(h) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function currentView(){
  if(S.view) return S.view;
  if(!S.done[1]) return "intro";
  if(!S.done[2]) return "play";
  if(!S.done[3]) return "s3";
  return "thanks";
}

/* ===== Render ===== */
function renderSteps(v){
  const box = $("#steps"); box.innerHTML = "";
  const cur = v==="s1"||v==="intro" ? 1 : v==="s2"||v==="play" ? 2 : v==="s3" ? 3 : 4;
  [1,2,3].forEach(n => box.append(el("div", {class: n===cur ? "on" : (S.done[n] || cur>n ? "done" : "")}, `${n}. ${STAGES[n].tab}`)));
}
function show(v){
  S.view = v; save();
  const app = $("#app"); app.innerHTML = ""; renderSteps(v);
  const box = el("section", {class:"fade"}); app.append(box);
  if(v==="intro") renderIntro(box);
  else if(v==="play") renderPlay(box);
  else if(v==="thanks") renderThanks(box);
  else renderStage(box, Number(v.slice(1)));
  window.scrollTo(0,0);
}
function noticeHTML(n){

  if(S.notice.ok) return `<div class="status ok" role="status">Respostas da etapa ${n} enviadas. Obrigada!</div>`;
  return `<div class="status warn" role="status">Não consegui enviar as respostas da etapa ${n} automaticamente. Copie o texto abaixo e mande para a Thalita (WhatsApp ou Instagram).</div>
  <textarea class="copybox" readonly id="copytxt">${esc(S.notice.text)}</textarea>
  <button class="btn ghost" type="button" id="copybtn">Copiar respostas</button>`;
}
function wireCopy(root){
  const b = $("#copybtn", root); if(!b) return;
  b.onclick = async () => {
    const t = $("#copytxt", root);
    try{ await navigator.clipboard.writeText(t.value); b.textContent = "Copiado ✓"; }
    catch(e){ t.focus(); t.select(); b.textContent = "Selecionado: use Copiar do celular"; }
  };
}
function renderIntro(box){
  box.innerHTML = `<h2>Antes de abrir a caixa</h2>
  <p class="lead">${STAGES[1].lead}</p>
  <div class="box"><strong>Como funciona</strong><br>1. Antes do jogo: perguntas rápidas e o preço que você pagaria.<br>2. Depois do jogo: como foi a experiência e o preço de novo.<br>3. Mercado: jogos parecidos, com fotos e preços, e o preço mais uma vez.</div>
  <p class="note">Suas respostas ficam neste aparelho entre as etapas. Se mudar de aparelho, use o mesmo nome ou apelido.</p>
  <div class="actions"><button class="btn" id="go" type="button">Começar</button></div>`;
  $("#go", box).onclick = () => show("s1");
}
function renderPlay(box){
  box.innerHTML = `<h2>Hora de jogar</h2>${noticeHTML(1)}
  <p class="lead">Etapa 1 pronta${S.name ? ", " + esc(S.name) : ""}. Abram a caixa e investiguem o caso. Quando terminarem (ou quando desistirem), volte aqui e toque em continuar.</p>
  <div class="actions"><button class="btn ghost" id="back" type="button">← Voltar às respostas</button><button class="btn" id="go" type="button">Já joguei, continuar</button></div>`;
  wireCopy(box); $("#go", box).onclick = () => show("s2"); $("#back", box).onclick = () => show("s1");
}
function renderThanks(box){
  box.innerHTML = `<h2>Obrigada por investigar com a gente</h2>${noticeHTML(3)}
  <p class="lead">Suas respostas ajudam a decidir o preço e o que mudar antes do lançamento. Se quiser contar mais alguma coisa, é só falar com a Thalita.</p>
  <p class="note">Seguimos em <strong>@beyondsuspicionclub</strong> no Instagram.</p>`;
  wireCopy(box);
}

function renderStage(box, n){
  const st = STAGES[n]; const A = S.a[n];
  box.innerHTML = `<h2>${st.title}</h2><p class="lead">${st.lead}</p>`;
  if(st.market) box.insertAdjacentHTML("beforeend", MARKET_HTML + `<p class="note">Os dois últimos formatos são diferentes do seu; os três primeiros são os mais parecidos com um kit físico de mistério.</p>`);
  const form = el("form", {novalidate:""}); box.append(form);
  const items = st.items.filter(i => !(i.ifNoName && S.name));
  items.forEach(it => form.append(renderItem(it, A, n)));
  form.append(el("div", {id:"failbox"}));
  const act = el("div", {class:"actions"}, `<button class="btn ghost" type="button" id="back">← Voltar</button><button class="btn" type="submit" id="sendbtn">${n===3 ? "Enviar respostas" : "Enviar e continuar"}</button><span class="note" id="msg" role="status"></span>`);
  form.append(act);
  $("#back", form).onclick = () => show(n===1 ? "intro" : n===2 ? "play" : "s2");
  form.onsubmit = ev => { ev.preventDefault(); submit(n, items, form); };
}

function renderItem(it, A, n){
  if(it.type==="h3") return el("h3", {}, it.text);
  if(it.type==="note"){ return el("p", {class:"lead"}, it.html); }
  const q = el(it.type==="single"||it.type==="multi"||it.type==="scale"||it.type==="grid" ? "fieldset" : "div", {class:"q", "data-id":it.id});
  const lab = el(q.tagName==="FIELDSET" ? "legend" : "label", it.type==="text"||it.type==="long" ? {for:"f_"+it.id} : {}, esc(it.label));
  q.append(lab);
  if(it.hint) q.append(el("span", {class:"hint"}, esc(it.hint)));
  if(it.type==="text"){
    const i = el("input", {type:"text", id:"f_"+it.id, autocomplete: it.id==="nome" ? "nickname" : "off", maxlength:"80"}); i.value = A[it.id] || "";
    i.oninput = () => { A[it.id] = i.value; save(); }; q.append(i);
  } else if(it.type==="long"){
    const t = el("textarea", {id:"f_"+it.id, maxlength:"1500"}); t.value = A[it.id] || "";
    t.oninput = () => { A[it.id] = t.value; save(); }; q.append(t);
  } else if(it.type==="single" || it.type==="multi"){
    const g = el("div", {class:"opts"}); const multi = it.type==="multi";
    it.options.forEach((o, k) => {
      const w = el("label", {class:"opt"}); const i = el("input", {type: multi ? "checkbox" : "radio", name:"f_"+it.id, value:o});
      i.checked = multi ? (A[it.id]||[]).includes(o) : A[it.id]===o;
      i.onchange = () => {
        if(multi){
          let cur = new Set(A[it.id]||[]);
          if(i.checked){ if(it.max && cur.size>=it.max){ i.checked=false; return; } cur.add(o); } else cur.delete(o);
          A[it.id] = [...cur];
        } else A[it.id] = o;
        save(); q.classList.remove("bad");
      };
      w.append(i, el("span", {}, esc(o))); g.append(w);
    });
    q.append(g);
  } else if(it.type==="scale"){
    q.append(scaleRow(it, A, it.id, q));
    q.append(el("div", {class:"ends"}, `<span>${esc(it.low)}</span><span>${esc(it.high)}</span>`));
  } else if(it.type==="grid"){
    const g = el("div", {class:"grid"});
    it.rows.forEach(([k, txt]) => { const r = el("div", {class:"row"}, `<div>${esc(txt)}</div>`); r.append(scaleRow(it, A, it.id+"_"+k, q)); g.append(r); });
    q.append(g);
  } else if(it.type==="money"){
    q.append(moneyRow(it, A, q));
  }
  q.append(el("div", {class:"err", role:"alert"}, "Responda esta pergunta para continuar."));
  return q;
}
function scaleRow(it, A, key, q){
  const n = it.max - it.min + 1;
  const g = el("div", {class:"scale" + (n>6 ? " s11" : "")});
  for(let v=it.min; v<=it.max; v++){
    const w = el("label", {class:"opt"}); const i = el("input", {type:"radio", name:"f_"+key, value:String(v)});
    i.checked = A[key]===v; i.onchange = () => { A[key] = v; save(); q.classList.remove("bad"); };
    w.append(i, el("span", {}, String(v))); g.append(w);
  }
  return g;
}
function moneyRow(it, A, q){
  const w = el("div", {class:"money"});
  const val = el("div", {class:"val"}); const r = el("input", {type:"range", min:it.min, max:it.max, step:it.step, "aria-label":it.label});
  const upd = () => {
    const touched = A[it.id] !== undefined;
    w.classList.toggle("untouched", !touched);
    val.classList.toggle("empty", !touched);
    val.textContent = touched ? brl(A[it.id]) + (A[it.id]>=it.max ? " ou mais" : "") : "Arraste para escolher";
    r.style.setProperty("--pct", ((Number(r.value)-it.min)/(it.max-it.min)*100)+"%");
  };
  r.value = A[it.id] !== undefined ? A[it.id] : it.min;
  const set = () => { A[it.id] = Number(r.value); save(); q.classList.remove("bad"); upd(); };
  r.addEventListener("input", set); r.addEventListener("change", set);
  r.addEventListener("pointerup", () => { if(A[it.id]===undefined) set(); });
  r.addEventListener("keydown", () => setTimeout(() => { if(A[it.id]===undefined) set(); }));
  w.append(val, r, el("div", {class:"ends"}, `<span>${brl(it.min)}</span><span>${brl(it.max)}</span>`));
  upd(); return w;
}

/* ===== Validação, resumo e envio ===== */
function flatItems(n){ const out=[]; STAGES[n].items.forEach(i => { if(i.type==="grid") i.rows.forEach(([k,t]) => out.push({id:i.id+"_"+k, label:i.label+" — "+t, type:"scale"})); else if(i.id) out.push(i); }); return out; }
function ansText(it, v){ if(v===undefined||v===""||(Array.isArray(v)&&!v.length)) return "(sem resposta)"; if(Array.isArray(v)) return v.join("; "); if(it.type==="money") return brl(v); return String(v); }
function summary(n){
  const A = S.a[n]; const lines = [`BSC Playtest · Etapa ${n} · ${S.name || A.nome || "sem nome"} · id ${S.id}`, ""];
  flatItems(n).forEach(it => { if(it.id==="nome") return; lines.push(`${it.label}\n→ ${ansText(it, A[it.id])}`); });
  return lines.join("\n");
}
function submit(n, items, form){
  const A = S.a[n]; let first = null;
  const bad = (id, msg) => { const q = $(`[data-id="${id}"]`, form); if(!q) return; q.classList.add("bad"); const e = $(".err", q); if(msg) e.textContent = msg; if(!first) first = q; };
  form.querySelectorAll(".q.bad").forEach(q => q.classList.remove("bad"));
  items.forEach(it => {
    if(!it.id || it.type==="long") return;
    if(it.type==="grid"){ if(it.rows.some(([k]) => A[it.id+"_"+k]===undefined)) bad(it.id); return; }
    const v = A[it.id];
    if(v===undefined || v==="" || (Array.isArray(v) && !v.length) || (typeof v==="string" && !v.trim())) bad(it.id);
  });
  ORDERS[n].forEach(ids => {
    for(let k=1; k<ids.length; k++){
      const a = A[ids[k-1]], b = A[ids[k]];
      if(a!==undefined && b!==undefined && b < a){ bad(ids[k], "Este valor ficou abaixo do anterior. Mantenha a ordem: barato ≤ boa compra ≤ caro ≤ caro demais."); }
    }
  });
  const msg = $("#msg", form);
  if(first){ msg.textContent = "Faltam respostas ou há valores fora de ordem."; first.scrollIntoView({behavior:"smooth", block:"center"}); return; }
  msg.textContent = "";
  if(n===1) S.name = (A.nome||"").trim(); else if(!S.name && A.nome) S.name = A.nome.trim();
  save();
  const next = n===1 ? "play" : n===2 ? "s3" : "thanks";
  const btn = $("#sendbtn", form), label = btn.textContent; btn.disabled = true; btn.textContent = "Enviando…";
  $("#failbox", form).innerHTML = "";
  send(n).then(res => {
    if(res.ok){ S.done[n] = true; S.sent[n] = true; S.notice = {n, ok:true, text:""}; save(); show(next); return; }
    btn.disabled = false; btn.textContent = "Tentar de novo";
    const fb = $("#failbox", form);
    fb.innerHTML = `<div class="status warn" role="alert">Não consegui enviar agora (${esc(res.why)}). Suas respostas continuam aqui: toque em <strong>Tentar de novo</strong>. Se não funcionar, copie o texto abaixo e mande para a Thalita.</div>
    <textarea class="copybox" readonly id="copytxt">${esc(summary(n))}</textarea>
    <div class="actions" style="margin-top:0"><button class="btn ghost" type="button" id="copybtn">Copiar respostas</button><button class="btn ghost" type="button" id="skip">Continuar sem enviar</button></div>`;
    wireCopy(fb);
    $("#skip", fb).onclick = () => { S.done[n] = true; S.notice = {n, ok:false, text:summary(n)}; save(); show(next); };
    fb.scrollIntoView({behavior:"smooth", block:"center"});
  });
}
async function send(n){
  if(!CONFIG.endpoint) return {ok:false, why:"sem endereço de envio configurado"};
  const A = S.a[n]; const body = {_subject:`BSC playtest · etapa ${n} · ${S.name || "sem nome"}`, etapa:n, id:S.id, nome:S.name, enviado_em:new Date().toISOString(), resumo:summary(n), ...CONFIG.extra};
  flatItems(n).forEach(it => { if(it.id!=="nome") body[it.id] = Array.isArray(A[it.id]) ? A[it.id].join("; ") : (A[it.id] ?? ""); });
  try{
    const r = await fetch(CONFIG.endpoint, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body:JSON.stringify(body)});
    if(r.ok) return {ok:true};
    let d = ""; try{ const j = await r.json(); d = j.error || (j.errors && j.errors[0] && j.errors[0].message) || ""; }catch(e){}
    return {ok:false, why:`erro ${r.status}${d ? ": "+d : ""}`};
  }catch(e){ return {ok:false, why:"sem conexão com o servidor"}; }
}

if(!S.a) S = load();
show(currentView());
</script>
